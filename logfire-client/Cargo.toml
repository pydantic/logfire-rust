[package]
name = "logfire-client"
version = "0.12.0"
description = "Logfire client SDK, query your Pydantic Logfire logs and metrics using SQL!"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["tls-aws-lc"]
# Use aws-lc-rs for TLS when the application has not installed a rustls `CryptoProvider`.
tls-aws-lc = ["reqwest/rustls"]

[dependencies]
logfire-core.workspace = true

chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
# a provider to install in tests which run without the `tls-aws-lc` feature
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
